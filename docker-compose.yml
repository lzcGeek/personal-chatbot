services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newagent
      POSTGRES_PASSWORD: newagent
      POSTGRES_DB: newagent
    ports:
      - "5434:5432"
    volumes:
      - newagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newagent -d newagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - newagent_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/newagent-graph
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - newagent_neo4j_data:/data
    restart: unless-stopped

volumes:
  newagent_postgres_data:
  newagent_qdrant_data:
  newagent_neo4j_data:
