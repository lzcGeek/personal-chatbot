[project]
name = "memory-mcp-chatbot"
version = "0.1.0"
description = "A focused web chatbot with semantic memory, MCP tools, and file-based skills."
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20.0",
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "jsonschema>=4.19.0",
    "mcp>=1.0.0",
    "openai>=1.60.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
