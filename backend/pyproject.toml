[project]
name = "memory-mcp-chatbot"
version = "0.1.0"
description = "A focused web chatbot with semantic memory, MCP tools, and file-based skills."
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "jsonschema>=4.19.0",
    "mcp>=1.0.0",
    "neo4j>=5.27.0,<7.0.0",
    "openai>=1.60.0",
    "pydantic-settings>=2.7.0",
    "pdfplumber>=0.11.4,<1.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.15.0,<2.0.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
eval = [
    "deepeval==4.1.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
